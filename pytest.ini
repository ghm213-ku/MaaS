[pytest]
# Pytest configuration for MaaS

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Markers
markers =
    asyncio: mark test as async
    slow: mark test as slow
    integration: mark test as integration test

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test timeout (in seconds) - adjust as needed
timeout = 30

# Minimum Python version
minversion = 7.0
